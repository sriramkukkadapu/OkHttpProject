name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to run against
        type: choice
        options: [test, qa, staging]
        default: test

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.env || 'test' }}
      # GoRest access token - add it under Settings → Secrets and variables → Actions
      GO_REST_API_TOKEN: ${{ secrets.GO_REST_API_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test -Denv=$TEST_ENV

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ env.TEST_ENV }}
          path: target/surefire-reports/
